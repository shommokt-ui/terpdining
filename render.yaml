services:
  - type: web
    name: terpdining-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    disk:
      name: terpdining-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "TerpDining <onboarding@resend.dev>"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DINING_DB_PATH
        value: /data/umd_dining.db
      - key: ENABLE_SCRAPE_SCHEDULER
        value: "true"
      - key: LANGSMITH_TRACING
        value: "false"
