name: Keep API warm during dining hours

on:
  workflow_dispatch:
  schedule:
    # Wake the API shortly before breakfast, then keep it awake until about 10 PM.
    # Local timezone keeps this aligned with Eastern daylight and standard time.
    # Off-minute runs avoid the top of the hour, when scheduled jobs can be busy.
    - cron: '57 6 * * *'
      timezone: America/New_York
    - cron: '7,17,27,37,47,57 7-21 * * *'
      timezone: America/New_York

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the lightweight health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 90 --output /dev/null
          https://terpdining.onrender.com/api/health
