name: Keep API warm during dining hours

on:
  workflow_dispatch:
  schedule:
    # Use a few long-lived jobs instead of a cron event for every ping.
    # GitHub can delay or drop scheduled events, so frequent pings alone proved
    # unreliable. These runs cover about 5 AM–11 PM Eastern year-round.
    - cron: '7 5,11,17 * * *'
      timezone: America/New_York

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    # Leave five minutes before the next six-hour run begins. Render sleeps
    # after 15 idle minutes, leaving some room for runner startup delays.
    timeout-minutes: 360
    steps:
      - name: Keep the API awake during dining hours
        shell: bash
        run: |
          deadline=$((SECONDS + 355 * 60))
          while (( SECONDS < deadline )); do
            checked_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            if curl --fail --silent --show-error --max-time 90 --output /dev/null \
              --write-out "API returned HTTP %{http_code} in %{time_total}s\n" \
              https://terpdining.onrender.com/api/health; then
              echo "$checked_at: ping succeeded"
            else
              echo "::warning title=API warm-up ping failed::$checked_at: health check failed; the next ping will retry"
            fi
            sleep 540
          done
