name: Keep API warm during dining hours

on:
  workflow_dispatch:
  schedule:
    # UTC window covers roughly 6 AM–11 PM Eastern during daylight time and
    # 5 AM–10 PM during standard time. Runs every 10 minutes, off the hour.
    - cron: '7,17,27,37,47,57 0-2,10-23 * * *'

permissions:
  contents: read

jobs:
  ping-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the lightweight health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 90 --output /dev/null
          https://terpdining.onrender.com/api/health
