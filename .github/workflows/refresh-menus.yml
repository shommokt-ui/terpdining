name: Refresh dining menus

on:
  workflow_dispatch:
  schedule:
    # Refresh daily before breakfast in Maryland, when menu traffic is low.
    - cron: '17 5 * * *'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: production-menu-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full seven-day refresh took 36 minutes for menus and then needs time
    # for nutrition labels; 45 minutes canceled before that phase finished.
    timeout-minutes: 120
    env:
      # Must point to the SAME PostgreSQL database as the Render API.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the production database
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::Add the DATABASE_URL repository secret from the Render API environment. Refusing to silently write to SQLite.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: pip install -r requirements-scraper.txt
      - name: Refresh menus, then nutrition
        run: python run_scraper.py --days 7
