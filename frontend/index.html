<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Crimson+Text:wght@400;700&family=Overpass:wght@400;700;800&family=Roboto+Condensed:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Crimson+Text:wght@400;700&family=Overpass:wght@400;700;800&family=Roboto+Condensed:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>TerpDining</title>
    <style>
      html,
      body {
        margin: 0;
        background-color: #fafafa;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #fafafa;
        z-index: 2147483647;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app-splash .app-splash-mark {
        width: 64px;
        height: 64px;
      }
      #app-splash .app-splash-name {
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #242424;
        font-size: 20px;
      }
      #app-splash .app-splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(226, 24, 51, 0.25);
        border-top-color: #e21833;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <img class="app-splash-mark" src="/favicon.svg" alt="" width="64" height="64" />
      <div class="app-splash-name">TERPDINING</div>
      <div class="app-splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
